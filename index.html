<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>我們的愛情時光</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft JhengHei", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: url('照片.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .love-card {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(15px);
      border-radius: 28px;
      padding: 45px 35px;
      text-align: center;
      color: #fff;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.3);
      max-width: 520px;
      width: 90%;
    }

    .heart {
      color: #ff4d75;
      font-size: 42px;
      margin-bottom: 12px;
      animation: heartbeat 1.4s infinite;
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      50% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }

    .title {
      font-size: 28px;
      margin-bottom: 15px;
    }

    .days {
      font-size: 68px;
      font-weight: bold;
      margin: 20px 0;
    }

    .time {
      font-size: 20px;
    }

    .music-ball {
      position: fixed;
      bottom: 22px;
      right: 22px;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: #ff4d75;
      color: white;
      font-size: 26px;
      border: none;
      cursor: pointer;
      z-index: 9999;
    }

    .music-panel {
      position: fixed;
      bottom: 95px;
      right: 22px;
      width: 230px;
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      display: none;
      z-index: 9999;
    }

    .music-panel.show {
      display: block;
    }

    .music-title {
      text-align: center;
      font-weight: bold;
      color: #ff4d75;
      margin-bottom: 14px;
      font-size: 15px;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .controls button {
      flex:1;
      padding: 10px 0;
      border:none;
      border-radius: 10px;
      background: #f6f6f6;
      font-size:14px;
      cursor: pointer;
    }

    .speed {
      display: flex;
      gap:6px;
      justify-content: center;
    }

    .speed button {
      padding: 6px 9px;
      border:none;
      border-radius:8px;
      background:#eee;
      font-size:13px;
    }

    .speed button.active {
      background:#ff4d75;
      color:white;
    }
  </style>
</head>

<body>

<div class="love-card">
  <div class="heart">❤️</div>
  <h1 class="title">我們相愛已經</h1>
  <div id="days" class="days">0</div>
  <div class="time" id="timeText"></div>
</div>

<div class="music-panel" id="musicPanel">
  <div class="music-title">🎵 愛情音樂</div>
  <div class="controls">
    <button id="prev">⏮ 上一首</button>
    <button id="playBtn">播放</button>
    <button id="next">下一首 ⏭</button>
  </div>
  <div class="speed">
    <button data-speed="0.75">0.75x</button>
    <button data-speed="1" class="active">1x</button>
    <button data-speed="1.25">1.25x</button>
    <button data-speed="1.5">1.5x</button>
  </div>
</div>

<button class="music-ball" id="musicBtn">🎵</button>
<audio id="bgMusic" loop>

<script>
  const startDate = new Date('2025-12-19T00:00:00');

  const playlist = [
    "音樂1.mp3",
    "音樂2.mp3",
    "音樂3.mp3"
  ];

  const bgMusic = document.getElementById('bgMusic');
  const musicBtn = document.getElementById('musicBtn');
  const musicPanel = document.getElementById('musicPanel');
  const playBtn = document.getElementById('playBtn');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const speedBtns = document.querySelectorAll('.speed button');

  let current = 0;

  function loadMusic() {
    bgMusic.src = playlist[current];
  }

  // 嘗試自動播放
  window.addEventListener('load', () => {
    loadMusic();
    setTimeout(() => {
      bgMusic.play().catch(() => {
        console.log('需點擊頁面才能播放');
      });
    }, 300);
  });

  // 點一下頁面就播放
  document.body.addEventListener('click', () => {
    if (bgMusic.paused) {
      bgMusic.play();
      playBtn.textContent = '暫停';
    }
  }, { once: true });

  musicBtn.addEventListener('click', () => {
    musicPanel.classList.toggle('show');
  });

  playBtn.addEventListener('click', async () => {
    if (bgMusic.paused) {
      try { await bgMusic.play(); } catch (e) {}
      playBtn.textContent = '暫停';
    } else {
      bgMusic.pause();
      playBtn.textContent = '播放';
    }
  });

  prevBtn.addEventListener('click', async () => {
    current = (current - 1 + playlist.length) % playlist.length;
    loadMusic();
    try { await bgMusic.play(); } catch (e) {}
    playBtn.textContent = '暫停';
  });

  nextBtn.addEventListener('click', async () => {
    current = (current + 1) % playlist.length;
    loadMusic();
    try { await bgMusic.play(); } catch (e) {}
    playBtn.textContent = '暫停';
  });

  speedBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      speedBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      bgMusic.playbackRate = parseFloat(btn.dataset.speed);
    });
  });

  function countDays() {
    const now = new Date();
    const diff = now - startDate;
    const d = Math.floor(diff / (1000*60*60*24));
    const h = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
    const m = Math.floor((diff % (1000*60*60)) / (1000*60));
    const s = Math.floor((diff % (1000*60)) / 1000);
    document.getElementById('days').innerText = d + ' 天';
    document.getElementById('timeText').innerText = h + ' 時 ' + m + ' 分 ' + s + ' 秒';
  }

  countDays();
  setInterval(countDays, 1000);
</script>

</body>
</html>
